<style>
/* Layout: login centrado; app con cabecera, pestañas y contenido en una columna de 980px */
:root{--bg:#f2f6f8;--card:#fff;--ink:#0d2233;--mute:#5b7183;--line:#d6e1e8;--accent:#0a6fa8;--accent-ink:#fff;--good:#1b8a5a;--warn:#b7791f;--bad:#c0392b;--soft:#e3f0f7;
--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Source Sans 3',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a26;--card:#12283a;--ink:#e6f0f6;--mute:#8fa8ba;--line:#24415a;--accent:#4db3e6;--accent-ink:#06202f;--good:#4cc790;--warn:#e3b04b;--bad:#f0786b;--soft:#17344b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a26;--card:#12283a;--ink:#e6f0f6;--mute:#8fa8ba;--line:#24415a;--accent:#4db3e6;--accent-ink:#06202f;--good:#4cc790;--warn:#e3b04b;--bad:#f0786b;--soft:#17344b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--fd);letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.lbox h1{font-size:38px;line-height:1}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.top{background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.top h1{font-size:26px;flex:1;min-width:180px}
.top .btn.ghost{color:var(--bg);border-color:#ffffff55}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.tile .n{font-family:var(--fd);font-size:40px;line-height:1;font-weight:700;color:var(--accent)}
.tile .l{color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.ok{color:var(--good)}.near{color:var(--warn)}.far{color:var(--bad)}.na{color:var(--mute)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)}.bar.near i{background:var(--warn)}
.ev{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev b{font-family:var(--fd);font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center}
.day{aspect-ratio:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.day.e{visibility:hidden}
.day.today{border-color:var(--accent);border-width:2px}
.day.sel{outline:3px solid var(--accent)}
.day small{font-weight:700}
.day.rt{color:#06202f}
.day.off{opacity:.55}
.day.fa{background:var(--line);color:var(--mute)}
.day.sch::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.lg{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.brand{height:44px;width:44px;border-radius:50%}
.lbox .brand{height:96px;width:96px;align-self:center}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{width:40px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:12px;margin-left:6px}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-22px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.tl .it.past::before{background:var(--mute)}
.cd{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--accent),#0b4f7a);color:#fff;border:0}
.cd .num{font:700 44px/1 "Barlow Condensed",Arial Narrow,sans-serif;text-align:center;min-width:70px}.cd .num small{display:block;font-size:14px;font-weight:600;opacity:.9}
.cd b{font-size:17px}.cd .mute{color:#e3f0f7}
.dleft{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.wk table{width:100%;font-size:15px}.wk td,.wk th{padding:8px 4px}.wk td,.wk th{text-align:center}.wk td:first-child,.wk th:first-child{text-align:left}
.alist div.nfi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.alist div.nfi.new{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.alist a.nfi{display:flex;justify-content:space-between;gap:8px;text-decoration:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}.alist a.nfi.new{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}.alist a.nfi>span:last-child{color:var(--accent);font-weight:700;white-space:nowrap}
.alist{display:flex;flex-direction:column;gap:6px}.alist button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.alist button span:last-child{color:var(--mute);font-size:14px;white-space:nowrap}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:12px;height:12px;border-radius:50%;display:inline-block}
.tl .it.rel{background:var(--soft);border-radius:8px;padding:8px 10px}
.tl .it.past{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--mute)}
.tl .it.past b{color:var(--mute);font-weight:600}
.tl .it.past .fin{font-size:12px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
tr.past td{color:var(--mute);background:var(--bg)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:4px 0 10px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
a{color:var(--accent)}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.ev-card h3{margin-bottom:4px}
.sec{display:grid;gap:4px}
@media (max-width:520px){.ev{grid-template-columns:56px 1fr}.ev>:last-child{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

.hello h2{font-size:34px;line-height:1.1}
.quote{border-left:5px solid var(--accent)}
.quote blockquote{margin:0 0 6px;font-size:19px;font-style:italic;line-height:1.4}
.sal{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sal .coin{width:56px;height:56px;flex:none}
.sal .big{font-family:var(--fd);font-size:44px;font-weight:700;line-height:1;color:#b8860b}
.coin-s{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.sheet{background:#fff;color:#222;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:75vh;color-scheme:light}
.sheet table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;font-family:Arial,var(--fb)}
.sheet td{border:1px solid #e3e7ec;padding:4px 8px;white-space:pre-wrap;vertical-align:middle;line-height:1.3;height:24px}

/* menú principal */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:4px}
.mbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);min-height:74px}
.mbtn:hover{border-color:var(--accent)}
.mbtn .ic{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--soft);border-radius:12px;flex:none}
.mbtn b{display:block;font-family:var(--fd);font-size:20px;letter-spacing:.02em}
.mbtn small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
@media (max-width:520px){.menu{grid-template-columns:1fr 1fr}.mbtn{flex-direction:column;align-items:flex-start;gap:8px}.mbtn small{display:none}}
/* pulpines */
.salinfo{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff7d6,var(--card));border-color:#e9c96b}
.salinfo .coin{width:52px;height:52px;flex:none}.salinfo p{margin:4px 0 0}
@media (prefers-color-scheme:dark){.salinfo{background:linear-gradient(135deg,#3a3214,var(--card))}}
.day.yes{background:#2e9d4f;color:#fff;border-color:#2e9d4f}.day.no{background:var(--line);color:var(--mute)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}.sw.yes{background:#2e9d4f}.sw.no{background:var(--line)}
/* diario: dureza y semáforo */
.lbl{font-weight:600;font-size:14px;margin-bottom:6px}
.rate button{width:auto;min-width:58px;flex:1;height:auto;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button b{font-size:18px}.rate button small{font-size:11px;font-weight:600;opacity:.8}
.feel{display:flex;gap:6px}
.feel button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel button i{width:30px;height:30px;border-radius:50%;background:var(--c);opacity:.45;box-shadow:inset 0 0 0 2px #0002}
.feel button small{font-size:11px;font-weight:600;color:var(--mute)}
.feel button[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.feel button[aria-pressed=true] i{opacity:1;transform:scale(1.12)}
.feel button[aria-pressed=true] small{color:var(--ink)}
.day.rt{color:#06202f}
.rank{display:flex;gap:14px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:10px}
.rank .pos{font-family:var(--fd);font-size:38px;font-weight:700;line-height:1;color:var(--accent);min-width:64px;text-align:center}
.rank .pos.lead{color:#b8860b}
.day.pend{background:#fde7a8;color:#5c4400;border-color:#e9c96b}.sw.pend{background:#fde7a8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;box-shadow:inset 0 0 0 1px #0003}
.cmpt td,.cmpt th{padding:6px 4px}.cmpt .c{text-align:center}
.cmp{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--mute)}
.cmp.sal{background:#2e9d4f;border-color:#2e9d4f;color:#fff}.cmp.onlyc,.cmp.onlya{background:#fde7a8;border-color:#e9c96b;color:#5c4400}.cmp.abs{background:var(--line)}
.day.nolist{background:repeating-linear-gradient(45deg,var(--card),var(--card) 4px,var(--soft) 4px,var(--soft) 8px)}.sw.nolist{background:repeating-linear-gradient(45deg,#fff,#fff 2px,#cfe3ef 2px,#cfe3ef 4px)}
.day{position:relative}.coinmark{position:absolute;top:-6px;right:-5px;font-size:13px;line-height:1}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sub{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;color:var(--ink)}
.sub[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.arow{border-top:1px solid var(--line);padding:10px 0 2px;display:grid;gap:8px}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.abtns .btn{width:100%}
/* chat */
.chatfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px #0004}
@media (max-width:520px){.chatfab span{display:none}.chatfab{font-size:22px;padding:12px 15px}}
.chatp{position:fixed;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 32px));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px #0005;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:520px){.chatp{inset:0;width:auto;height:auto;border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
.chath{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.chath .btn{padding:6px 10px}
.chatb{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.45;font-size:15px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.chips{display:flex;flex-direction:column;gap:6px}.chip{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);font-size:14px}
.chatf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}.chatf textarea{min-height:42px;max-height:120px;resize:none}
.chatn{font-size:11px;padding:0 12px 8px}
/* app instalada: respetar la muesca del iPhone */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px #0003;display:flex;gap:10px;align-items:center;z-index:9}
.install p{margin:0;flex:1;font-size:14px}
</style>
</head>

const daysTo=d=>Math.round((new Date(d+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);

function nextComps(a){return D.comps.filter(c=>c.start&&c.end>=TODAY&&relevant(c,a)).sort((x,y)=>x.start.localeCompare(y.start))}
function relevant(c,a){const k=String(c.cat||'').toLowerCase(),y=String(a.year);if(a.cat==='master')return !!c.ms;if(c.ms)return false;if(a.cat==='benjamin')return /benjam/.test(k)||k.includes(y);if(a.cat==='junior')return /j[uú]nior|absolut/.test(k)||k.includes(y);if(a.cat==='infantil')return /infantil/.test(k)||k.includes(y);return /alev/.test(k)||k.includes(y)}

function loadChart(days){

 const cur=wk(TODAY),ws=[];for(let i=9;i>=0;i--){const x=new Date(cur+'T12:00:00');x.setDate(x.getDate()-7*i);ws.push(iso(x))}
 const L=ws.map(k=>W[k]?W[k].l:0),A=ws.map(k=>W[k]&&W[k].fn?W[k].f/W[k].fn:null),N=ws.map(k=>W[k]?W[k].n:0);
 if(!Object.keys(W).length)return '<h3>Control de carga</h3><p class="mute">Cuando se valoren entrenamientos aparecerá aquí la carga semanal.</p>';
 const prev=L.slice(5,9).filter(x=>x>0),chr=prev.length?prev.reduce((s,x)=>s+x,0)/prev.length:0,ac=L[9],ratio=chr?ac/chr:null;
 let st=['na','Sin base de comparación'];if(ratio!==null){st=ratio>1.5?['far','Carga muy alta']:ratio>1.3?['near','Carga alta, vigilar']:ratio>=.8?['ok','Carga equilibrada']:['near','Carga baja']}
 const w=640,h=240,l=44,r=40,tp=14,b=34,mx=Math.max(...L,5)*1.15,bw=(w-l-r)/10;
 const y=v=>tp+(h-tp-b)*(1-v/mx),y2=v=>tp+(h-tp-b)*(1-(v-1)/4);
 let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Carga semanal de entrenamiento y sensaciones">`;
 for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);s+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v)}</text>`}
 [1,3,5].forEach(v=>s+=`<circle cx="${w-r+10}" cy="${y2(v)}" r="5" fill="${FEEL[v][0]}"/>`);
 ws.forEach((k,i)=>{const x=l+i*bw+bw*.18,bh=(h-b)-y(L[i]);s+=`<rect x="${x}" y="${y(L[i])}" width="${bw*.64}" height="${Math.max(bh,0)}" rx="3" fill="var(--accent)" opacity="${i===9?1:.6}"><title>Semana del ${fd(k)}: carga ${L[i]}, ${N[i]} entrenos</title></rect><text x="${x+bw*.32}" y="${h-b+14}" text-anchor="middle" font-size="10" fill="var(--mute)">${k.slice(8)}/${k.slice(5,7)}</text>`});
 const pts=ws.map((k,i)=>A[i]===null?null:[l+i*bw+bw/2,y2(A[i]),A[i]]);
 s+=`<polyline fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 3" points="${pts.filter(Boolean).map(p=>p[0]+','+p[1]).join(' ')}"/>`;
 pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===9?7:5}" fill="${FEEL[Math.round(p[2])][0]}" stroke="#fff" stroke-width="1.5"><title>Sensaciones medias ${p[2].toFixed(1)}</title></circle>`});
 s+='</svg>';
 return `<h3>Control de carga</h3><div class="row"><span class="pill ${st[0]}">${st[1]}</span>${ratio!==null?`<span class="mute">Esta semana ${ac} frente a ${Math.round(chr)} de media de las 4 anteriores (×${ratio.toFixed(2).replace('.',',')})</span>`:''}</div>
 <div class="lg"><span>Barras: carga semanal (suma de la dureza)</span><span>Puntos: sensaciones medias</span></div>${s}

function qComps(q){const stop=['campionat','catalunya','campeonato','cataluna','internacional','ciutat'];
 const w=q.replace(/invierno/g,'hivern').replace(/verano/g,'estiu').replace(/alevin/g,'alevi');
 return D.comps.filter(c=>c.start).map(c=>{let s=0;nn(c.name).replace(/aleví/g,'alevi').split(/[^a-z]+/).filter(x=>x.length>3&&!stop.includes(x)).forEach(x=>{if(w.includes(x))s+=2});
  if(c.norm&&(new RegExp('\\b'+nn(c.norm)+'\\b').test(w)||new RegExp('normativa\\s*0?'+parseInt(c.norm.slice(1))+'\\b').test(w)))s+=5;return {c,s}}).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s).map(x=>x.c)}
function compText(c){const L=NORMS[c.norm]?`https://www.natacio.cat/wp-json/files/ow-getFile?file=${NORMS[c.norm]}`:c.pdf?`https://www.natacio.cat/wp-json/files/ow-getFile?file=${c.pdf}`:'';
 return `**${c.name}** (${c.norm?'normativa '+c.norm:c.ms?'calendario FCN Màster':'calendario del club'})\n• ${c.cat||''}${c.venue?' · '+c.venue:''}${c.pool?' · piscina '+c.pool:''}\n• Fechas: del ${fd(c.start)} al ${fd(c.end)}`+
 (c.mfrom?`\n• Marcas válidas: del ${fd(c.mfrom)} al ${fd(c.mto)}`:'')+(c.iopen?`\n• Inscripción: del ${fd(c.iopen)} al ${fd(c.iclose)}`:'')+(c.prov?`\n• Listado provisional: ${fd(c.prov)}${c.defi?' · definitivo: '+fd(c.defi):''}`:'')+(c.notes?`\n• Notas: ${c.notes}`:'')+(L?`\n• Normativa: ${L}`:'')}
function markLine(m){const c=m.s+corr(m),mm=(se,lab)=>{const x=mInfo(m,se);return x?` · ${lab} ${x.min}: ${x.ok?'✅':'faltan '+x.gap.toFixed(2).replace('.',',')+' s ('+x.pct.toFixed(1).replace('.',',')+' %)'}`:''};return `• ${evName(m.ev)} (piscina ${m.pool} m): **${m.t}**${corr(m)?` (manual, corregida ${fmt(c)})`:''} · ${fd(m.date)}${m.place?' · '+m.place:''}${m.pts?' · '+m.pts+' pts':''}${mm('inv','mín. invierno')}${mm('ver','mín. verano')}`}
function monthSal(a,mk){let n=0;Object.keys(att).forEach(d=>{if(d.startsWith(mk)&&isTrainDay(d,a.cat)&&d<=TODAY&&isSalowi(a.id,d))n++});return n}
function answer(raw){
 const q=nn(raw),coach=S.user.role==='coach',mk=ym(new Date());
 let who=coach?qAthletes(q):[athlete(S.aid)];
 if(coach&&who.length>1)return `He encontrado varios nadadores que encajan: ${who.map(a=>'**'+a.name+'**').join(', ')}. Escribe también el apellido.`;
 if(!coach){const known=new Set(['salowi','salowis','pulpin','pulpines','hola','campionat','campeonato','catalunya','cataluna','liga','lliga','jornada','normativa','world','aquatics','espana','espanya','open','gran','premi','que','cual','cuando','cuantos','cuantas','como','donde','mis','mi','me','el','la','los','las']);
  nn(athlete(S.aid).name).split(/\s+/).forEach(w=>known.add(w));D.comps.concat(D.ligas).forEach(c=>nn(c.name).split(/[^a-z]+/).forEach(w=>known.add(w)));MESES.forEach(w=>known.add(nn(w)));
  const caps=(String(raw).match(/[A-ZÁÉÍÓÚÑÇ][a-záéíóúñçü]{2,}/g)||[]).map(nn).filter(w=>!known.has(w));
  const firstWord=nn((String(raw).trim().match(/^[¿¡]?([A-Za-zÁÉÍÓÚÑÇáéíóúñçü]+)/)||[])[1]||'');
  if(caps.filter(w=>w!==firstWord).length)return 'Solo puedo responder sobre tus propios datos. Si quieres saber algo de otro nadador o nadadora, pregúntaselo al entrenador.'}
 const a=who[0]||null,me=!coach;
 const ev=qEvent(q);
 // Pulpines / asistencia
 if(has(q,/salowi|pulpin|asistencia|asisti|vino|ranking|clasificaci|primer|gana|cabeza|posicion/)){
  if(a){const s=salowis(a,mk),p=teamPos(a,mk);return `${me?'Llevas':'**'+a.name+'** lleva'} **${s.got} ${s.got===1?'Pulpín':'Pulpines'}** en ${MESES[+mk.slice(5)-1]} (de ${s.max} entrenos con lista).`+(p&&s.got&&p.got===s.got?`\n• Posición en el equipo: **${p.pos}.ª** de ${p.n}${p.tie?` (empate con ${p.tie})`:''}.`:'')+(s.pend?`\n• ${s.pend} ${s.pend===1?'entreno marcado':'entrenos marcados'} como «Asistió» sin valoración completa (falta dureza, sensaciones o comentario).`:'')+'\n• Pulpín = «Asistió» en la lista del entrenador + entreno valorado con dureza, sensaciones y comentario.'}
  const r=D.athletes.map(x=>({x,n:monthSal(x,mk)})).filter(o=>o.n>0).sort((u,v)=>v.n-u.n);
  if(!r.length)return `Todavía nadie tiene Pulpines en ${MESES[+mk.slice(5)-1]}.`;
  return `**Pulpines de ${MESES[+mk.slice(5)-1]}** (todo el equipo):\n`+r.slice(0,10).map(o=>`${1+r.filter(z=>z.n>o.n).length}.ª · ${o.x.name}: ${o.n}${o.n===r[0].n?' 🏆':''}`).join('\n')}
 // Calendario / competiciones / normativas
 if(has(q,/liga|lliga|jornada/)){const cat=a?a.cat:(has(q,/infantil/)?'infantil':has(q,/alevi/)?'alevin':null);
  const ls=D.ligas.filter(l=>!cat||(cat==='alevin'?/alev/i.test(l.cat):cat==='infantil'?/infantil/i.test(l.cat):false));
  return ls.length?`**${ls[0].name}**\n`+ls.map(l=>`• Jornada ${l.j}: del ${fd(l.start)} al ${fd(l.end)} · entrega de tiempos ${fd(l.deadline)} · publicación ${fd(l.pub)}`).join('\n'):'No hay ligas para esa categoría en el calendario.'}
 const cs=qComps(q).filter(c=>coach||relevant(c,a)),wantsCal=has(q,/campeonat|campionat|competici|inscripci|cuando|fecha|dia |plazo|listado|normativ|norma|reglament|requisit|pruebas puedo|liga|lliga|jornada|proxim|calendario/);
 if(cs.length&&(wantsCal||!ev.d))return cs.slice(0,2).map(compText).join('\n\n')+(has(q,/normativ|norma|reglament|requisit|pruebas puedo/)?'\n\nEl detalle (pruebas, requisitos, horarios) está en el PDF de la normativa. No puedo leerlo por dentro: ábrelo con el enlace.':'');
 if(wantsCal&&!ev.d){const list=a?nextComps(a):D.comps.filter(c=>c.start&&c.end>=TODAY).sort((x,y)=>x.start.localeCompare(y.start));
  return list.length?(a?`Próximas competiciones ${me?'de tu categoría':'de la categoría de **'+a.name+'**'}:\n\n`:'Próximas competiciones:\n\n')+list.slice(0,3).map(compText).join('\n\n'):'No hay competiciones pendientes en el calendario.'}
 // Mínimas
 if(has(q,/minim|corte|clasific/)){
  const ses=has(q,/verano|estiu|summer/)?['ver']:has(q,/invierno|hivern|winter/)?['inv']:['inv','ver'];
  if(a){if(!hasMins(a))return `En categoría ${catOf(a).toLowerCase()} no hay tiempos mínimos.`;
   return ses.map(se=>{let b=best(a).filter(m=>mInfo(m,se));if(ev.d)b=b.filter(m=>m.ev.startsWith(ev.d)&&(!ev.st||m.ev.endsWith(ev.st)));const lab=se==='inv'?'❄️ Invierno':'☀️ Verano';
    if(!b.length)return `${lab} · **${minComp(a,se)}**: no ${me?'tienes':'tiene'} marcas con mínima${ev.d?' en esa prueba':''}.`;
    const ok=b.filter(m=>mInfo(m,se).ok),nr=b.filter(m=>!mInfo(m,se).ok).sort((x,y)=>mInfo(x,se).pct-mInfo(y,se).pct);
    return `${lab} · **${minComp(a,se)}**\n`+(ok.length?`✅ Conseguidas (${ok.length}): ${ok.map(m=>evName(m.ev)+' '+m.pool+' m').join(', ')}.\n`:'')+(nr.length?`🎯 Más cercanas:\n`+nr.slice(0,3).map(m=>{const x=mInfo(m,se);return `• ${evName(m.ev)} (${m.pool} m): ${fmt(m.c)} → ${x.min} · faltan ${x.gap.toFixed(2).replace('.',',')} s (${x.pct.toFixed(1).replace('.',',')} %)`}).join('\n'):'')}).join('\n\n')}
  return ses.map(se=>{const near=[];D.athletes.filter(hasMins).forEach(x=>best(x).forEach(m=>{const y=mInfo(m,se);if(y&&!y.ok&&y.pct<=2)near.push([x,m,y])}));const okn=D.athletes.filter(x=>x.marks.some(m=>{const y=mInfo(m,se);return y&&y.ok}));
   return `${se==='inv'?'❄️ **Campeonatos de invierno**':'☀️ **Campeonatos de verano**'} (Júnior e Infantil): **${okn.length} nadadores** con alguna mínima conseguida.`+(near.length?`\nA menos del 2 %:\n`+near.sort((u,v)=>u[2].pct-v[2].pct).slice(0,10).map(([x,m,y])=>`• ${x.name} · ${evName(m.ev)} (${m.pool} m): ${fmt(m.c)} → ${y.min} (+${y.gap.toFixed(2).replace('.',',')} s)`).join('\n'):'\nNadie está a menos del 2 %.')}).join('\n\n')}
 // Entrenamientos
 if(has(q,/entreno|entrenamiento|dureza|sensacion|carga|cansad|valorad/)&&!has(q,/valoracion del entrenador|opina/)){
  if(!a)return 'Dime de qué nadador quieres ver los entrenamientos (por ejemplo: «entrenamientos de Laia Gilabert»).';
  const days=trainDays(a.id),rec=Object.entries(days).filter(([d,v])=>d.startsWith(mk)&&v.r>0).sort();const av=k=>{const x=rec.filter(([,v])=>v[k]>0).map(([,v])=>v[k]);return x.length?(x.reduce((s,z)=>s+z,0)/x.length).toFixed(1).replace('.',','):'—'};
  return `Entrenos valorados ${me?'':'por **'+a.name+'** '}en ${MESES[+mk.slice(5)-1]}: **${rec.length}** · dureza media ${av('r')}/5 · sensaciones medias ${av('s')}/5.`+(rec.length?`\nÚltimo: ${fd(rec[rec.length-1][0])} · dureza ${rec[rec.length-1][1].r}/5 · ${FEEL[rec[rec.length-1][1].s]?FEEL[rec[rec.length-1][1].s][1].toLowerCase()+' sensaciones':''}${rec[rec.length-1][1].n?` · «${rec[rec.length-1][1].n}»`:''}`:'')}
 // Valoraciones del entrenador
 if(has(q,/valoracion|opina|comentario del entrenador|feedback/)){if(!a)return 'Dime de qué nadador quieres ver las valoraciones.';const l=evals[a.id]||[];
  return l.length?l.slice(0,3).map(e=>`**${e.comp}** · ${fd(e.date)}\n${e.general}${e.pos?'\n• Positivo: '+e.pos:''}${e.mej?'\n• A mejorar: '+e.mej:''}`).join('\n\n'):`Todavía no hay valoraciones${me?'':' de '+a.name}.`}
 // Puntos
 if(has(q,/punto|fina|world aquatics|mejor prueba/)){
  if(a){const t=best(a).filter(m=>m.pts).sort((x,y)=>y.pts-x.pts).slice(0,3);return t.length?`${me?'Tus mejores pruebas':'Mejores pruebas de **'+a.name+'**'} por puntos World Aquatics:\n`+t.map(markLine).join('\n'):'No hay marcas con puntos.'}
  const all=[];D.athletes.forEach(x=>x.marks.forEach(m=>{if(m.pts)all.push([x,m])}));return '**Mejores puntuaciones del equipo:**\n'+all.sort((u,v)=>v[1].pts-u[1].pts).slice(0,8).map(([x,m])=>`• ${x.name} · ${evName(m.ev)} (${m.pool} m): ${m.t} · ${m.pts} pts`).join('\n')}
 // Marcas
 if(ev.d||has(q,/marca|tiempo|record|crono|mejor/)){
  if(!a&&coach){if(!ev.d)return 'Dime de qué nadador y qué prueba (por ejemplo: «mejor marca de Carla Cuesta en 100 libre»).';
   const r=[];D.athletes.forEach(x=>best(x).forEach(m=>{if(m.ev===ev.d+(ev.st||m.ev.slice(-1))&&(!ev.pool||m.pool===ev.pool))r.push([x,m])}));
   if(!r.length)return `No hay marcas de ${ev.d} m${ev.st?' '+STYN[ev.st].toLowerCase():''} en el equipo.`;
   return `**Mejores marcas del equipo en ${ev.d} m${ev.st?' '+STYN[ev.st].toLowerCase():''}** (tiempo corregido):\n`+r.sort((u,v)=>u[1].pool-v[1].pool||u[1].c-v[1].c).slice(0,10).map(([x,m])=>`• ${x.name} (${m.pool} m): ${fmt(m.c)} · ${fd(m.date)}`).join('\n')}
  let ms=best(a);if(ev.d)ms=ms.filter(m=>m.ev.startsWith(ev.d)&&(!ev.st||m.ev.endsWith(ev.st))&&(!ev.pool||m.pool===ev.pool));
  if(!ms.length)return `No ${me?'tienes':'hay'} marcas${me?'':' de **'+a.name+'**'} en ${ev.d?ev.d+' m'+(ev.st?' '+STYN[ev.st].toLowerCase():''):'ninguna prueba'}${ev.pool?' en piscina de '+ev.pool+' m':''}.`;
  if(!ev.d)ms=ms.filter(m=>m.pts).sort((x,y)=>y.pts-x.pts).slice(0,5);
  return `${me?(ev.d?'Tu mejor marca':'Tus mejores marcas'):(ev.d?'Mejor marca':'Mejores marcas')+' de **'+a.name+'**'}${ev.d?' en '+ev.d+' m'+(ev.st?' '+STYN[ev.st].toLowerCase():''):''}:\n`+ms.map(markLine).join('\n')}
 if(!coach&&D.athletes.length===1&&/[a-z]{3,}\s+[a-z]{3,}/.test(q)&&has(q,/de [a-z]+ [a-z]+/))return 'Solo puedo responder sobre tus propios datos.';
 return `No he entendido la pregunta. Puedo ayudarte con:\n• **Marcas**: «${coach?'mejor marca de Carla Cuesta en 100 libre':'mi mejor marca en 100 libre'}»\n• **Mínimas**: «${coach?'quién está cerca de una mínima':'qué mínimas tengo más cerca'}»\n• **Pulpines**: «${coach?'quién va primero en Pulpines':'cuántos Pulpines llevo'}»\n• **Competiciones**: «cuándo cierra la inscripción del Campionat Júnior d'Hivern»\n• **Normativas**: «normativa del Campionat Infantil d'Hivern»\n• **Entrenamientos y valoraciones**${coach?' de un nadador':''}`}
function chatButton(){let b=$('#chatfab');if(!b){b=document.createElement('button');b.id='chatfab';b.className='chatfab';b.innerHTML='🤖 <span>Asistente</span>';b.onclick=()=>{CHAT.open=true;chatRender()};document.body.appendChild(b)}b.hidden=!S.user||CHAT.open}
function chatRender(){
 chatButton();let p=$('#chatp');if(!CHAT.open){if(p)p.remove();return}
 if(!p){p=document.createElement('div');p.id='chatp';p.className='chatp';p.setAttribute('role','dialog');p.setAttribute('aria-label','Asistente');document.body.appendChild(p)}
 const coach=S.user.role==='coach',me0=coach?null:athlete(S.aid),sug=CHAT_SUG[coach?'coach':'athlete'].map(s=>me0&&!hasMins(me0)&&/mínimas/.test(s)?'¿Cuáles son mis mejores pruebas por puntos?':s);
 p.innerHTML=`<div class="chath"><b>🤖 Asistente CN Salou</b><span class="sp"></span>${CHAT.msgs.length?'<button class="btn ghost" id="chnew" title="Empezar de nuevo">Nueva</button>':''}<button class="btn ghost" id="chx" aria-label="Cerrar">✕</button></div>
 <div class="chatb" id="chb">${CHAT.msgs.length?'':`<p class="mute" style="margin:0 0 8px">${coach?'Pregúntame por marcas, mínimas, Pulpines, entrenamientos, valoraciones, competiciones o normativas de cualquier nadador.':'Pregúntame por tus marcas, tus mínimas, tus Pulpines, tus entrenos o las competiciones y normativas de tu categoría.'}</p><div class="chips">${sug.map(s=>`<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
  ${CHAT.msgs.map(m=>`<div class="msg ${m.role}">${m.role==='assistant'?md(m.content):esc(m.content)}</div>`).join('')}</div>
 <form class="chatf" id="chf"><textarea id="chq" rows="1" placeholder="Escribe tu pregunta…"></textarea><button class="btn">Enviar</button></form>
 <div class="mute chatn">Asistente automático de la app: responde solo con los datos que ${coach?'ves':'tienes'} aquí. No usa inteligencia artificial externa y ningún dato sale de la app.</div>`;
 const b=$('#chb');b.scrollTop=b.scrollHeight;
 $('#chx').onclick=()=>{CHAT.open=false;chatRender()};
 if($('#chnew'))$('#chnew').onclick=()=>{CHAT.msgs=[];chatRender()};
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>chatSend(c.dataset.q));
 const q=$('#chq');q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chf').requestSubmit()}};
 $('#chf').onsubmit=e=>{e.preventDefault();chatSend(q.value)};q.focus()}
function chatSend(t){t=String(t||'').trim();if(!t)return;CHAT.msgs.push({role:'user',content:t});let r;try{r=answer(t)}catch(e){r='No he podido responder a eso. Prueba a escribirlo de otra forma.'}CHAT.msgs.push({role:'assistant',content:r});chatRender()}

(function(){const t=LS.get('cnsalou_t',null);if(t){TOKEN=t;loadAll()}else loginView()})();
</script>

/* modo app: funciona sin cobertura para abrir y muestra cómo instalarla */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{}));
/* si se instala una versión nueva de la app mientras está abierta, recargar una vez para mostrarla */
if('serviceWorker' in navigator&&navigator.serviceWorker.controller){let rel=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rel)return;rel=true;location.reload()})}
(function(){
 const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 if(standalone||LS.get('cnsalou_noinstall',false))return;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);let deferred=null;
 function show(html,btn){const d=document.createElement('div');d.className='install';d.innerHTML=`<img src="icon-192.png" alt="" width="40" height="40" style="border-radius:9px"><p>${html}</p>${btn?'<button class="btn" id="ib">Instalar</button>':''}<button class="btn ghost" id="ix" aria-label="Cerrar">✕</button>`;document.body.appendChild(d);
  d.querySelector('#ix').onclick=()=>{d.remove();LS.set('cnsalou_noinstall',true)};
  if(btn)d.querySelector('#ib').onclick=async()=>{d.remove();deferred.prompt();await deferred.userChoice}}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show('<b>Instala la app</b> en tu móvil para abrirla como una app más.',true)});
 if(ios)setTimeout(()=>show('<b>Instala la app:</b> pulsa <b>Compartir</b> <span aria-hidden="true">⬆︎</span> y luego <b>Añadir a pantalla de inicio</b>.',false),1500);
})();
