<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zona Nadadores CN Salou</title>
<meta name="theme-color" content="#0d2233">
<meta name="description" content="App de los nadadores del C.N. Salou: marcas, mínimas, calendario, entrenamientos y salowis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CN Salou">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: login centrado; app con cabecera, pestañas y contenido en una columna de 980px */
:root{--bg:#f2f6f8;--card:#fff;--ink:#0d2233;--mute:#5b7183;--line:#d6e1e8;--accent:#0a6fa8;--accent-ink:#fff;--good:#1b8a5a;--warn:#b7791f;--bad:#c0392b;--soft:#e3f0f7;
--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Source Sans 3',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a26;--card:#12283a;--ink:#e6f0f6;--mute:#8fa8ba;--line:#24415a;--accent:#4db3e6;--accent-ink:#06202f;--good:#4cc790;--warn:#e3b04b;--bad:#f0786b;--soft:#17344b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a26;--card:#12283a;--ink:#e6f0f6;--mute:#8fa8ba;--line:#24415a;--accent:#4db3e6;--accent-ink:#06202f;--good:#4cc790;--warn:#e3b04b;--bad:#f0786b;--soft:#17344b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--fd);letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.lbox h1{font-size:38px;line-height:1}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.top{background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.top h1{font-size:26px;flex:1;min-width:180px}
.top .btn.ghost{color:var(--bg);border-color:#ffffff55}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.tile .n{font-family:var(--fd);font-size:40px;line-height:1;font-weight:700;color:var(--accent)}
.tile .l{color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.ok{color:var(--good)}.near{color:var(--warn)}.far{color:var(--bad)}.na{color:var(--mute)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)}.bar.near i{background:var(--warn)}
.ev{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev b{font-family:var(--fd);font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center}
.day{aspect-ratio:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.day.e{visibility:hidden}
.day.today{border-color:var(--accent);border-width:2px}
.day.sel{outline:3px solid var(--accent)}
.day small{font-weight:700}
.day.rt{color:#06202f}
.day.off{opacity:.55}
.day.fa{background:var(--line);color:var(--mute)}
.day.sch::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.lg{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.brand{height:44px;width:44px;border-radius:50%}
.lbox .brand{height:96px;width:96px;align-self:center}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{width:40px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:12px;margin-left:6px}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-22px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.tl .it.past::before{background:var(--line)}
.tl .it.rel{background:var(--soft);border-radius:8px;padding:8px 10px}
a{color:var(--accent)}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.ev-card h3{margin-bottom:4px}
.sec{display:grid;gap:4px}
@media (max-width:520px){.ev{grid-template-columns:56px 1fr}.ev>:last-child{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}

.hello h2{font-size:34px;line-height:1.1}
.quote{border-left:5px solid var(--accent)}
.quote blockquote{margin:0 0 6px;font-size:19px;font-style:italic;line-height:1.4}
.sal{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sal .coin{width:56px;height:56px;flex:none}
.sal .big{font-family:var(--fd);font-size:44px;font-weight:700;line-height:1;color:#b8860b}
.coin-s{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.sheet{background:#fff;color:#222;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:75vh;color-scheme:light}
.sheet table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;font-family:Arial,var(--fb)}
.sheet td{border:1px solid #e3e7ec;padding:4px 8px;white-space:pre-wrap;vertical-align:middle;line-height:1.3;height:24px}

/* menú principal */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:4px}
.mbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);min-height:74px}
.mbtn:hover{border-color:var(--accent)}
.mbtn .ic{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--soft);border-radius:12px;flex:none}
.mbtn b{display:block;font-family:var(--fd);font-size:20px;letter-spacing:.02em}
.mbtn small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
@media (max-width:520px){.menu{grid-template-columns:1fr 1fr}.mbtn{flex-direction:column;align-items:flex-start;gap:8px}.mbtn small{display:none}}
/* salowis */
.salinfo{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff7d6,var(--card));border-color:#e9c96b}
.salinfo .coin{width:52px;height:52px;flex:none}.salinfo p{margin:4px 0 0}
@media (prefers-color-scheme:dark){.salinfo{background:linear-gradient(135deg,#3a3214,var(--card))}}
.day.yes{background:#2e9d4f;color:#fff;border-color:#2e9d4f}.day.no{background:var(--line);color:var(--mute)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}.sw.yes{background:#2e9d4f}.sw.no{background:var(--line)}
/* diario: dureza y semáforo */
.lbl{font-weight:600;font-size:14px;margin-bottom:6px}
.rate button{width:auto;min-width:58px;flex:1;height:auto;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button b{font-size:18px}.rate button small{font-size:11px;font-weight:600;opacity:.8}
.feel{display:flex;gap:6px}
.feel button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel button i{width:30px;height:30px;border-radius:50%;background:var(--c);opacity:.45;box-shadow:inset 0 0 0 2px #0002}
.feel button small{font-size:11px;font-weight:600;color:var(--mute)}
.feel button[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.feel button[aria-pressed=true] i{opacity:1;transform:scale(1.12)}
.feel button[aria-pressed=true] small{color:var(--ink)}
.day.rt{color:#06202f}
.rank{display:flex;gap:14px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:10px}
.rank .pos{font-family:var(--fd);font-size:38px;font-weight:700;line-height:1;color:var(--accent);min-width:64px;text-align:center}
.rank .pos.lead{color:#b8860b}
/* app instalada: respetar la muesca del iPhone */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px #0003;display:flex;gap:10px;align-items:center;z-index:9}
.install p{margin:0;flex:1;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const LOGO="logo.png";
const NORMS={N09:22519,N10:22520,N20:22530,N21:22531,N22:22532,N24:22534,N25:22535,N26:22536,N27:22795,N28:22796};
const STY={L:0,E:1,B:2,M:3,S:4},STYN={L:'Libre',E:'Espalda',B:'Braza',M:'Mariposa',S:'Estilos'};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={user:null,tab:'resumen',aid:null,month:null,day:null};
let D=null,TOKEN=null,evals={},train={},att={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function evName(e){const m=e.match(/^(\d+)([LEBMS])$/);return m?m[1]+' m '+STYN[m[2]].toLowerCase():e}
function evSort(a,b){const ma=a.match(/^(\d+)([A-Z])/),mb=b.match(/^(\d+)([A-Z])/);return STY[ma[2]]-STY[mb[2]]||ma[1]-mb[1]}
function corr(m){return m.ch==='Manual'?(m.ev.startsWith('50')?.29:.19):0}
const RC=r=>`hsl(${135-(r-1)*14} 65% 62%)`;
function wk(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function fmt(s){const m=Math.floor(s/60),x=s-m*60;return String(m).padStart(2,'0')+':'+x.toFixed(2).padStart(5,'0')}
function fd(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function iso(d){return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}
const TODAY=iso(new Date());
const athlete=id=>D.athletes.find(a=>a.id===id);
/* Frase motivacional de la semana (cambia cada lunes; se repiten en ciclo). Traducciones al castellano. */
const QUOTES=[
 ['No puedes ponerle límites a nada. Cuanto más sueñas, más lejos llegas.','Michael Phelps','natación'],
 ['He fallado una y otra vez en mi vida. Y por eso tengo éxito.','Michael Jordan','baloncesto'],
 ['Odiaba cada minuto de entrenamiento, pero me decía: no abandones. Sufre ahora y vive el resto de tu vida como un campeón.','Muhammad Ali','boxeo'],
 ['Fallas el 100 % de los tiros que no intentas.','Wayne Gretzky','hockey sobre hielo'],
 ['El éxito no es casualidad. Es trabajo duro, perseverancia, aprendizaje, estudio, sacrificio y, sobre todo, amor por lo que haces.','Pelé','fútbol'],
 ['Los campeones siguen jugando hasta que lo hacen bien.','Billie Jean King','tenis'],
 ['Todos tenemos sueños. Pero para hacerlos realidad hace falta mucha determinación, dedicación, autodisciplina y esfuerzo.','Jesse Owens','atletismo'],
 ['Empieza donde estás. Usa lo que tienes. Haz lo que puedas.','Arthur Ashe','tenis'],
 ['No soy la próxima Usain Bolt ni el próximo Michael Phelps. Soy la primera Simone Biles.','Simone Biles','gimnasia'],
 ['Creo que todo es posible si te lo propones y le dedicas el trabajo y el tiempo necesarios.','Michael Phelps','natación'],
 ['Todo lo negativo, la presión, los retos, es una oportunidad para crecer.','Kobe Bryant','baloncesto'],
 ['No pienso en límites.','Usain Bolt','atletismo'],
 ['No cuentes los días, haz que los días cuenten.','Muhammad Ali','boxeo'],
 ['El talento sin trabajo no es nada.','Cristiano Ronaldo','fútbol'],
 ['Cuanto más difícil es la victoria, mayor es la felicidad de ganar.','Pelé','fútbol'],
 ['Es difícil vencer a alguien que nunca se rinde.','Babe Ruth','béisbol'],
 ['Nunca subestimes el poder de los sueños.','Wilma Rudolph','atletismo'],
 ['Dar menos que lo mejor de ti es desperdiciar tu talento.','Steve Prefontaine','atletismo'],
 ['Es mejor mirar hacia delante y prepararse que mirar atrás y lamentarse.','Jackie Joyner-Kersee','atletismo'],
 ['Unos quieren que algo pase, otros sueñan con que pase y otros hacen que pase.','Michael Jordan','baloncesto'],
 ['Un ganador reconoce su talento, trabaja hasta el límite para desarrollarlo y lo usa para lograr sus objetivos.','Larry Bird','baloncesto'],
 ['Empiezas temprano y te quedas hasta tarde, día tras día, año tras año. El éxito de la noche a la mañana lleva muchos años.','Lionel Messi','fútbol']];
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)}
const quoteOfWeek=()=>QUOTES[isoWeek(new Date())%QUOTES.length];
const COIN=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#f5c542" stroke="#b8860b" stroke-width="4"/><circle cx="32" cy="32" r="21" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="3 3"/><text x="32" y="42" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="30" fill="#7a5800">S</text></svg>`;
const isTrainDay=d=>{const w=new Date(d+'T12:00:00').getDay();return w>=1&&w<=4};
/* Salowis: 1 por cada entrenamiento (L-J) en el que el entrenador marca «Asistió». Máximo = entrenamientos con lista del grupo.
   Para un nadador, el servidor marca con _g los días en que su grupo tuvo lista. */
function salowis(a,mk){const all=attDays(mk),grp=new Set(D.athletes.filter(x=>x.cat===a.cat).map(x=>x.id));grp.add('_g');let got=0,max=0;
 Object.keys(all).forEach(d=>{if(!isTrainDay(d)||d>TODAY)return;const day=all[d];if(!Object.keys(day).some(k=>grp.has(k)))return;max++;if(day[a.id]==='p')got++});return {got,max}}
function salSeason(a){const ms=new Set(Object.keys(att).map(d=>d.slice(0,7)));let t=0;ms.forEach(mk=>t+=salowis(a,mk).got);return t}
/* Posición en el equipo por Salowis del mes. Nadador: la calcula el servidor; entrenador: se calcula aquí con la lista completa. */
function teamPos(a,mk){
 if(D.rank)return D.rank[mk]||null;
 const c={};Object.keys(att).forEach(d=>{if(!d.startsWith(mk)||!isTrainDay(d)||d>TODAY)return;Object.keys(att[d]).forEach(k=>{if(att[d][k]==='p')c[k]=(c[k]||0)+1})});
 if(!Object.keys(c).length)return null;
 const mine=c[a.id]||0,vals=D.athletes.map(x=>c[x.id]||0);
 return {pos:1+vals.filter(v=>v>mine).length,tie:vals.filter(v=>v===mine).length-1,n:D.athletes.length,got:mine}}
function posHtml(a,mk,me){const p=teamPos(a,mk);if(!p)return '';
 const lead=p.pos===1&&p.got>0,who=me?'tú':'este nadador';
 const tie=p.tie>0?`Empate en ${p.pos}.ª posición: ${who} y ${p.tie} ${p.tie===1?'compañero/a más':'compañeros/as más'}.`:(lead?(me?'¡Vas en 1.ª posición del equipo!':'¡Va en 1.ª posición del equipo!'):'');
 return `<div class="rank"><div class="pos${lead?' lead':''}">${lead?'🏆 ':''}${p.pos}.ª</div><div><div><b>Posición en el equipo</b> <span class="mute">de ${p.n} nadadores</span></div>${tie?`<div class="${lead?'ok':'mute'}" style="font-weight:600">${tie}</div>`:''}</div></div>`}
function salCard(a){const mk=ym(new Date()),{got,max}=salowis(a,mk),tot=salSeason(a),me=S.user.role==='athlete';
 const msg=max===0?'Cuando el entrenador pase lista empezarás a sumar salowis.':(got===max?`<b class="ok">¡Pleno! ${me?'No te has perdido':'No se ha perdido'} ningún entrenamiento este mes.</b> `:`${me?'Has venido':'Ha venido'} a ${got} de ${max} entrenamientos este mes. `)+'¡A final de mes, quien tenga más salowis gana!';
 return `<div class="card"><h3>Salowis de ${MESES[+mk.slice(5)-1]}</h3><div class="sal" style="margin-top:8px"><span class="coin">${COIN}</span><div><div class="big">${got}<span class="mute" style="font-size:20px;font-weight:600"> / ${max}</span></div><div class="mute">1 salowi por cada entrenamiento al que ${me?'vienes':'viene'} · ${tot} en toda la temporada</div></div></div>${posHtml(a,mk,me)}<p style="margin:10px 0 0">${msg}</p></div>`}
const SAL_INFO=()=>`<div class="card salinfo"><span class="coin">${COIN}</span><div><h3>¿Qué son los Salowis?</h3><p>Son puntos que se consiguen por cada entreno al que asistes. ¡A final de mes, el nadador o nadadora con más Salowis será el ganador o ganadora!</p></div></div>`;
function hello(a){if(S.user.role!=='athlete')return '';const q=QUOTES[new Date().getMonth()];
 return `<div class="hello"><h2>¡Hola, ${esc(a.name.split(' ')[0])}!</h2></div>
 <div class="card quote"><blockquote>«${esc(q[0])}»</blockquote><div class="mute">— <b>${esc(q[1])}</b>, ${esc(q[2])} · Frase de ${MESES[new Date().getMonth()]}</div></div>`}
const errMsg=e=>String((e&&e.message)||e||'error').replace(/^Error:\s*/,'');

/* ---------- llamadas al script ---------- */
async function api(fn,...args){
 let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
 catch(e){throw new Error(navigator.onLine?'No se ha podido conectar con el servidor.':'Sin conexión a internet.')}
 let j;try{j=await r.json()}catch(e){throw new Error('Respuesta no válida del servidor.')}
 if(!j.ok){const m=j.error||'error';if(/SESION/.test(m))logout('Tu sesión ha caducado. Vuelve a entrar.');throw new Error(m)}
 return j.data}

/* ---------- login ---------- */
function busy(msg){$('#app').innerHTML=`<div class="login"><div class="lbox" style="align-items:center"><img class="brand" src="${LOGO}" alt="Logo del C.N. Salou"><p class="mute" role="status">${esc(msg)}</p></div></div>`}
function loginView(msg){
 $('#app').innerHTML=`<div class="login"><form class="lbox" id="lf" autocomplete="off"><img class="brand" src="${LOGO}" alt="Logo del C.N. Salou"><h1>Zona Nadadores</h1><p class="mute" style="margin:0">C.N. Salou · Temporada 26-27</p>
 <label for="u">Usuario<input id="u" autocapitalize="none" autocomplete="username" placeholder="nombre.apellido" value="${esc(LS.get('cnsalou_u',''))}"></label>
 <label for="p">PIN o contraseña<input id="p" type="password" inputmode="numeric" autocomplete="current-password"></label>
 <div class="err" id="er" role="alert">${esc(msg||'')}</div><button class="btn" id="lb" type="submit">Entrar</button></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim().toLowerCase(),p=$('#p').value.trim();
  $('#lb').disabled=true;$('#er').textContent='Comprobando…';
  try{const r=await api('login',u,p);if(r.error){$('#er').textContent=r.error;$('#lb').disabled=false;return}
   TOKEN=r.token;LS.set('cnsalou_t',TOKEN);LS.set('cnsalou_u',u);await loadAll()}
  catch(x){$('#er').textContent='No se ha podido conectar: '+errMsg(x);$('#lb').disabled=false}}
}
async function loadAll(){busy('Cargando tus datos…');
 try{const r=await api('getData',TOKEN);if(r.error){logout(r.error);return}
  D=r;D.rank=r.rank||null;evals=r.evals||{};train=r.train||{};att=r.att||{};start(r)}
 catch(e){if(!/SESION/.test(e.message))loginView('No se han podido cargar los datos: '+e.message)}}
function logout(msg){TOKEN=null;LS.set('cnsalou_t',null);S={user:null,tab:'inicio',aid:null,month:null,day:null};PG.g=null;PG.msg='';loginView(msg)}
function start(r){const keep=S.user&&S.user.user===r.user;S.user={role:r.role,user:r.user,name:r.name};
 if(r.role==='athlete')S.aid=r.athletes[0].id;else if(!keep||!athlete(S.aid))S.aid=D.athletes[0].id;
 if(!keep)S.tab='inicio';render()}

/* ---------- datos guardados ---------- */
function trainDays(aid){return train[aid]||{}}
async function saveDay(aid,date,val){
 try{const r=await api('saveTrain',TOKEN,date,val);train[aid]=r.days;return 'Guardado. El entrenador ya lo puede ver.'}
 catch(e){return 'No se ha guardado: '+e.message}}
async function saveEval(aid,ev){const r=await api('saveEval',TOKEN,aid,ev);evals[aid]=r.items}
async function delEval(aid,id){const r=await api('delEval',TOKEN,aid,id);evals[aid]=r.items;render()}
function attDays(mk){const o={};Object.keys(att).forEach(d=>{if(d.startsWith(mk))o[d]=att[d]});return o}
async function saveAtt(date,aids,val){
 try{const r=await api('saveAtt',TOKEN,date,aids,val);att=r.att;return 'Guardado.'}
 catch(e){return 'No se ha guardado: '+e.message}}

/* ---------- render ---------- */
function render(){
 const a=athlete(S.aid),coach=S.user.role==='coach';
 const tabs=sections(coach);
 $('#app').innerHTML=`<header class="top"><div class="wrap"><img class="brand" src="${LOGO}" alt="Logo del C.N. Salou"><h1>${coach?'Panel del entrenador':esc(a.name)}</h1>
 ${coach?`<label class="row" style="color:var(--bg)" for="sel">Nadador<select id="sel" style="width:auto;color:var(--ink)">${['junior','infantil','alevin'].map(c=>`<optgroup label="${c==='alevin'?'Alevín':c[0].toUpperCase()+c.slice(1)}">${D.athletes.filter(x=>x.cat===c).map(x=>`<option value="${esc(x.id)}" ${x.id===S.aid?'selected':''}>${esc(x.name)}${x.user?'':' (sin usuario)'}</option>`).join('')}</optgroup>`).join('')}</select></label>`:`<span class="mute" style="color:var(--bg)">${a.cat==='alevin'?'Alevín':a.cat[0].toUpperCase()+a.cat.slice(1)} · ${a.year}</span>`}
 <button class="btn ghost" id="rl" title="Volver a leer el Excel">Actualizar</button><button class="btn ghost" id="out">Salir</button></div></header>
 <main class="wrap"><nav class="tabs" role="tablist">${tabs.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav><section id="v"></section>
 <p class="mute" style="text-align:center;margin-top:20px">Datos del Excel leídos el ${esc(D.built)}</p></main>`;
 $('#out').onclick=()=>logout();
 $('#rl').onclick=()=>loadAll();
 if(coach)$('#sel').onchange=e=>{S.aid=e.target.value;S.day=null;render()};
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
 ({inicio:vHome,asis:coach?vAsis:vAsisMe,prog:vProg,resumen:vRes,marcas:vMar,minimas:vMin,cal:vCal,norm:vNorm,ent:vEnt,val:vVal})[S.tab](a);
 window.scrollTo(0,0);
}
/* Apartados: [id, nombre, icono, descripción] */
function sections(coach){
 const A=[['resumen','Resumen','📊','Tu temporada de un vistazo'],['asis','Asistencia','🪙','Tus Salowis y tus entrenos'],['ent','Entrenamiento','💪','Cómo ha ido cada entreno'],['marcas','Marcas','⏱️','Todas tus mejores marcas'],['minimas','Mínimas','🎯','Lo cerca que estás de cada mínima'],['cal','Calendario','📅','Competiciones y ligas'],['norm','Normativas','📄','Documentos de la federación'],['val','Valoraciones','⭐','Lo que opina el entrenador']];
 if(!coach)return [['inicio','Inicio','🏠',''],...A];
 return [['inicio','Inicio','🏠',''],['asis','Asistencia','📋','Pasar lista y Salowis del grupo'],['prog','Programación entrenamientos','🗓️','El archivo de entrenamientos'],
  ['resumen','Resumen','📊','Resumen del nadador elegido'],['ent','Entrenamiento','💪','Cómo valoró cada entreno'],['marcas','Marcas','⏱️','Marcas del nadador elegido'],['minimas','Mínimas','🎯','Distancia a cada mínima'],['cal','Calendario','📅','Competiciones y ligas'],['norm','Normativas','📄','Documentos de la federación'],['val','Valoraciones','⭐','Escribir y ver valoraciones']]}
function vHome(a){
 const coach=S.user.role==='coach',q=quoteOfWeek(),sal=coach?null:salowis(a,ym(new Date()));
 $('#v').innerHTML=`<div class="stack"><div class="hello"><h2>¡Hola, ${coach?'Entrenador/a':esc(a.name.split(' ')[0])}!</h2></div>
 <div class="card quote"><blockquote>«${esc(q[0])}»</blockquote><div class="mute">— <b>${esc(q[1])}</b>, ${esc(q[2])} · Frase de la semana</div></div>
 ${coach?`<p class="mute" style="margin:4px 0 0">Los apartados del nadador muestran a <b>${esc(a.name)}</b>. Cámbialo arriba, en «Nadador».</p>`:''}
 <div class="menu">${sections(coach).filter(t=>t[0]!=='inicio').map(t=>`<button class="mbtn" data-go="${t[0]}"><span class="ic" aria-hidden="true">${t[2]}</span><span><b>${t[1]}</b><small>${t[0]==='asis'&&sal?`${sal.got} salowis este mes`:t[3]}</small></span></button>`).join('')}</div></div>`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;render()})}
/* Asistencia del nadador: Salowis y días con lista */
function vAsisMe(a){
 if(!S.amonth)S.amonth=ym(new Date());const mk=S.amonth,[y,m]=mk.split('-').map(Number),all=attDays(mk),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
 const grp=new Set(D.athletes.filter(x=>x.cat===a.cat).map(x=>x.id));grp.add('_g');
 let cells='';for(let i=0;i<off;i++)cells+='<div class="day e"></div>';
 for(let d=1;d<=n;d++){const k=mk+'-'+String(d).padStart(2,'0'),day=all[k]||{},list=Object.keys(day).some(x=>grp.has(x)),v=day[a.id];
  const cls=v==='p'?'yes':(list?'no':'');cells+=`<div class="day ${cls} ${isTrainDay(k)?'sch':'off'} ${k===TODAY?'today':''}" aria-label="Día ${d}${v==='p'?', asististe':list?', no asististe':''}">${d}${v==='p'?'<small>🪙</small>':list?'<small>✕</small>':''}</div>`}
 const {got,max}=salowis(a,mk);
 $('#v').innerHTML=`<div class="stack">${SAL_INFO()}${salCard(a)}
 <div class="card"><div class="row"><button class="btn ghost" id="am" aria-label="Mes anterior">‹</button><h3 class="sp" style="text-align:center">${MESES[m-1]} ${y}</h3><button class="btn ghost" id="an2" aria-label="Mes siguiente">›</button></div>
 <div class="cal" style="margin-top:10px">${['L','M','X','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
 <div class="row mute" style="margin-top:10px;font-size:14px"><span><span class="sw yes"></span> Asististe (+1 salowi)</span><span><span class="sw no"></span> No asististe</span><span>Según la lista del entrenador · ${got} de ${max} en ${MESES[m-1]}</span></div></div></div>`;
 $('#am').onclick=()=>{S.amonth=ym(new Date(y,m-2,1));render()};$('#an2').onclick=()=>{S.amonth=ym(new Date(y,m,1));render()}}
function best(a){return a.marks.map(m=>({...m,c:m.s+corr(m)})).sort((x,y)=>evSort(x.ev,y.ev)||x.pool-y.pool)}
function stat(m){if(m.ok===undefined)return['na','Sin mínima'];if(m.ok)return['ok','Conseguida'];return m.pct<=2?['near','Casi ('+m.pct.toFixed(1).replace('.',',')+'%)']:['far','+'+m.pct.toFixed(1).replace('.',',')+'%']}
function nextComps(a){return D.comps.filter(c=>c.start&&c.end>=TODAY&&relevant(c,a)).sort((x,y)=>x.start.localeCompare(y.start))}
function relevant(c,a){const k=String(c.cat||'').toLowerCase(),y=String(a.year);if(a.cat==='junior')return /j[uú]nior|absolut/.test(k)||k.includes(y);if(a.cat==='infantil')return /infantil/.test(k)||k.includes(y);return /alev/.test(k)||k.includes(y)}
function attMonth(a){const days=trainDays(a.id),now=new Date(),mk=ym(now),n=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),off=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;let s=0,t=0;for(let d=1;d<=n;d++){const k=mk+'-'+String(d).padStart(2,'0');if(((off+d-1)%7)<4&&k<=TODAY){s++;if(days[k]&&days[k].r>0)t++}}return s?Math.round(t/s*100)+'%':'—'}
function vRes(a){
 const b=best(a),withMin=b.filter(m=>m.ok!==undefined),ok=withMin.filter(m=>m.ok),near=withMin.filter(m=>!m.ok&&m.pct<=2);
 const nx=nextComps(a)[0],ls=(evals[a.id]||[])[0];
 const top=b.filter(m=>m.pts).sort((x,y)=>y.pts-x.pts).slice(0,3);
 $('#v').innerHTML=`<div class="stack"><div class="grid g4">
 <div class="card tile"><div class="n">${b.length}</div><div class="l">marcas registradas</div></div>
 ${a.cat!=='alevin'?`<div class="card tile"><div class="n">${ok.length}</div><div class="l">mínimas conseguidas de ${withMin.length}</div></div><div class="card tile"><div class="n">${near.length}</div><div class="l">a menos del 2%</div></div>`:`<div class="card tile"><div class="n">—</div><div class="l">alevín: sin mínimas</div></div>`}
 <div class="card tile"><div class="n">${(()=>{const x=salowis(a,ym(new Date()));return x.max?Math.round(x.got/x.max*100)+'%':'—'})()}</div><div class="l">asistencia este mes (lista del entrenador)</div></div>
 <div class="card tile"><div class="n">${top[0]?top[0].pts:'—'}</div><div class="l">mejor puntuación World Aquatics</div></div></div>
 <div class="grid g2">
 <div class="card"><h3>Próxima competición</h3>${nx?`<p><b>${esc(nx.name)}</b><br><span class="mute">${fd(nx.start)} – ${fd(nx.end)} · ${esc(nx.venue||'')}</span></p><p class="mute">Inscripción: ${fd(nx.iopen)} a ${fd(nx.iclose)}</p>`:'<p class="mute">Sin competiciones pendientes.</p>'}</div>
 <div class="card"><h3>Última valoración del entrenador</h3>${ls?`<p><b>${esc(ls.comp)}</b> · ${fd(ls.date)}</p><p>${esc(ls.general)}</p>`:'<p class="mute">Todavía no hay valoraciones.</p>'}</div></div>
 ${top.length?`<div class="card"><h3>Mejores pruebas por puntos</h3>${top.map(m=>`<div class="ev"><b>${evName(m.ev)}</b><div><div class="bar"><i style="width:${Math.min(100,m.pts/10)}%"></i></div></div><div>${fmt(m.s)} · <b>${m.pts}</b> pts</div></div>`).join('')}</div>`:''}
 ${near.length?`<div class="card"><h3>Mínimas al alcance</h3>${near.map(m=>`<div class="ev"><b>${evName(m.ev)}</b><span class="mute">${m.pool} m</span><div>${fmt(m.c)} → ${m.min} <span class="pill near">+${m.gap.toFixed(2).replace('.',',')} s</span></div></div>`).join('')}</div>`:''}
 </div>`}
function vMar(a){
 const b=best(a);
 $('#v').innerHTML=`<div class="card"><h2>Marcas</h2><p class="mute">Una marca por prueba y piscina. Las manuales se corrigen +0,29 s (50 m) o +0,19 s (resto).</p><div class="tw"><table><thead><tr><th>Prueba</th><th>Piscina</th><th class="r">Marca</th><th>Crono</th><th class="r">Corregida</th><th class="r">Puntos</th><th>Fecha</th><th>Lugar</th></tr></thead><tbody>
 ${b.map(m=>`<tr><td><b>${evName(m.ev)}</b></td><td>${m.pool} m</td><td class="r">${m.t}</td><td>${esc(m.ch)}</td><td class="r">${fmt(m.c)}</td><td class="r">${m.pts||'—'}</td><td>${fd(m.date)}</td><td>${esc(m.place||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
function vMin(a){
 if(a.cat==='alevin'){$('#v').innerHTML='<div class="card"><h2>Mínimas</h2><p>En categoría alevín no hay tiempos mínimos. Las pruebas se distribuyen por ligas y jornadas; consulta el calendario.</p></div>';return}
 const b=best(a).filter(m=>m.ok!==undefined);
 $('#v').innerHTML=`<div class="card"><h2>Marcas frente a mínimas</h2><p class="mute">La barra muestra lo cerca que está tu marca corregida de la mínima de Cataluña (año ${a.year}).</p>
 ${b.map(m=>{const[k,t]=stat(m);const p=m.ok?100:Math.max(4,100-m.pct*4);return `<div class="ev"><b>${evName(m.ev)}</b><div><div class="bar ${k}"><i style="width:${p}%"></i></div><div class="mute">${m.pool} m · ${fd(m.date)}</div></div><div style="text-align:right">${fmt(m.c)} / ${m.min}<br><span class="pill ${k}">${t}</span></div></div>`}).join('')||'<p class="mute">No hay pruebas con mínima definida.</p>'}</div>`}
function vCal(a){
 const list=D.comps.filter(c=>c.start).sort((x,y)=>x.start.localeCompare(y.start));
 const lig=D.ligas.filter(l=>a.cat==='alevin'?/Alev/.test(l.cat):a.cat==='infantil'?/Infantil/.test(l.cat):false);
 $('#v').innerHTML=`<div class="card"><h2>Calendario general</h2><p class="mute">Resaltadas, las competiciones de tu categoría.</p><div class="tl">
 ${list.map(c=>`<div class="it ${(c.end||c.start)<TODAY?'past':''} ${relevant(c,a)?'rel':''}"><b>${esc(c.name)}</b> <span class="pill na">${esc(c.norm)}</span><br><span>${fd(c.start)} – ${fd(c.end)}</span> · <span class="mute">${esc(c.venue||'')} ${c.pool?'· '+esc(c.pool):''}</span><br><span class="mute">${esc(c.cat)}</span>${c.iopen?`<br><span class="mute">Inscripción ${fd(c.iopen)} – ${fd(c.iclose)}${c.prov?' · provisional '+fd(c.prov):''}${c.defi?' · definitivo '+fd(c.defi):''}</span>`:''}</div>`).join('')}</div></div>
 ${lig.length?`<div class="card" style="margin-top:12px"><h3>${esc(lig[0].name)}</h3><div class="tw"><table><thead><tr><th>Jornada</th><th>Del</th><th>Al</th><th>Entrega de tiempos</th><th>Publicación</th></tr></thead><tbody>${lig.map(l=>`<tr><td>${esc(l.j)}</td><td>${fd(l.start)}</td><td>${fd(l.end)}</td><td>${fd(l.deadline)}</td><td>${fd(l.pub)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`}
function vNorm(a){
 const seen={};D.comps.forEach(c=>{if(c.norm&&!seen[c.norm])seen[c.norm]=c});
 $('#v').innerHTML=`<div class="card"><h2>Normativas</h2><p class="mute">Documentos oficiales de la Federació Catalana de Natació. Se abren en la web federativa.</p><div class="stack">
 ${Object.values(seen).sort((x,y)=>(relevant(y,a)-relevant(x,a))||x.norm.localeCompare(y.norm)).map(c=>`<div class="row"><span class="pill ${relevant(c,a)?'ok':'na'}">${esc(c.norm)}</span><div class="sp"><b>${esc(c.name)}</b><br><span class="mute">${esc(c.cat)}</span></div>${NORMS[c.norm]?`<a href="https://www.natacio.cat/wp-json/files/ow-getFile?file=${NORMS[c.norm]}" target="_blank" rel="noopener">Abrir PDF</a>`:''}</div>`).join('')}</div>
 <div class="note" style="margin-top:12px">Las normativas pueden actualizarse. Ante cualquier duda, manda el documento vigente de la federación.</div></div>`}
/* Diario de entrenamiento: dureza 1-5, sensaciones 1-5 (semáforo) y comentario */
const HARD=['','Muy suave','Suave','Normal','Duro','Muy duro'];
const FEEL=[null,['#e53935','Muy malas'],['#fb8c00','Malas'],['#fdd835','Normales'],['#9ccc65','Buenas'],['#2e9d4f','Muy buenas']];
function vEnt(a){
 const now=new Date();if(!S.month)S.month=ym(now);const[y,m]=S.month.split('-').map(Number);
 const days=trainDays(a.id),first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7,mn=MESES[m-1];
 const rec=Object.entries(days).filter(([d,v])=>d.startsWith(S.month)&&v.r>0).map(([,v])=>v);
 const avg=k=>{const x=rec.filter(v=>v[k]>0).map(v=>v[k]);return x.length?(x.reduce((s,z)=>s+z,0)/x.length).toFixed(1).replace('.',','):'—'};
 let cells='';for(let i=0;i<off;i++)cells+='<div class="day e"></div>';
 for(let d=1;d<=n;d++){const k=S.month+'-'+String(d).padStart(2,'0'),v=days[k],sc=isTrainDay(k),f=v&&v.r&&FEEL[v.s];
  cells+=`<button class="day ${v&&v.r?'rt':''} ${v&&!v.r?'fa':''} ${sc?'sch':'off'} ${k===TODAY?'today':''} ${k===S.day?'sel':''}" ${f?`style="background:${f[0]}"`:''} data-d="${k}" aria-label="Día ${d}${v?(v.r?', dureza '+v.r+' de 5'+(f?', sensaciones '+f[1].toLowerCase():''):', no asistió'):''}">${d}${v?`<small>${v.r||'✕'}</small>`:''}</button>`}
 const ro=S.user.role==='coach';
 $('#v').innerHTML=`<div class="stack" style="margin-bottom:12px">${SAL_INFO()}${salCard(a)}</div><div class="grid g2"><div class="card"><div class="row"><button class="btn ghost" id="pm" aria-label="Mes anterior">‹</button><h3 class="sp" style="text-align:center">${mn} ${y}</h3><button class="btn ghost" id="nm" aria-label="Mes siguiente">›</button></div>
 <div class="cal" style="margin-top:10px">${['L','M','X','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
 <p class="mute">El número es la dureza (1 a 5) y el color, las sensaciones. El punto marca los días de entrenamiento (lunes a jueves).</p>
 <div class="row" style="margin-top:4px"><div class="tile"><div class="n">${rec.length}</div><div class="l">entrenos valorados</div></div><div class="tile"><div class="n">${avg('r')}</div><div class="l">dureza media</div></div><div class="tile"><div class="n">${avg('s')}</div><div class="l">sensaciones medias</div></div></div></div>
 <div class="card" id="ed">${S.day?'':`<p class="mute">${ro?'Elige un día para ver cómo valoró el entrenamiento.':'Elige un día en el calendario para valorar cómo fue el entrenamiento.'}</p>`}</div></div>
 <div class="card" style="margin-top:12px" id="lc">${loadChart(days)}</div>`;
 $('#pm').onclick=()=>{S.month=ym(new Date(y,m-2,1));render()};$('#nm').onclick=()=>{S.month=ym(new Date(y,m,1));render()};
 document.querySelectorAll('.day[data-d]').forEach(b=>b.onclick=()=>{S.day=b.dataset.d;render();const e=$('#ed');if(e&&innerWidth<700)e.scrollIntoView({behavior:'smooth'})});
 if(!S.day)return;
 const v=days[S.day]||{r:0,s:0,n:''},ab=days[S.day]&&!days[S.day].r;let r=ab?0:Math.min(5,v.r||0),f=v.s||0;
 $('#ed').innerHTML=`<h3>${fd(S.day)}</h3><div class="stack">
  <div><div class="lbl">Dureza del entrenamiento</div><div class="rate" id="rt">${[1,2,3,4,5].map(i=>`<button data-r="${i}" aria-pressed="${r===i}" ${ro?'disabled':''}><b>${i}</b><small>${HARD[i]}</small></button>`).join('')}</div></div>
  <div><div class="lbl">¿Cómo me he sentido?</div><div class="feel" id="fl">${[1,2,3,4,5].map(i=>`<button data-f="${i}" aria-pressed="${f===i}" style="--c:${FEEL[i][0]}" ${ro?'disabled':''}><i></i><small>${FEEL[i][1]}</small></button>`).join('')}</div><div class="lg"><span>Malas sensaciones</span><span>Muy buenas sensaciones</span></div></div>
  <label for="nt">Mi comentario<span class="mute" style="font-weight:400">¿Qué me ha salido bien? ¿En qué me he fijado? ¿Qué tengo que mejorar?</span><textarea id="nt" rows="5" ${ro?'readonly':''} placeholder="Me ha salido bien…&#10;Me he fijado en…&#10;Tengo que mejorar…">${esc(v.n)}</textarea></label>

function loadChart(days){
 const W={};Object.entries(days).forEach(([d,v])=>{if(!v.r)return;const k=wk(d);const w=W[k]||(W[k]={n:0,l:0,f:0,fn:0});w.n++;w.l+=Math.min(5,v.r);if(v.s){w.f+=v.s;w.fn++}});
 const cur=wk(TODAY),ws=[];for(let i=9;i>=0;i--){const x=new Date(cur+'T12:00:00');x.setDate(x.getDate()-7*i);ws.push(iso(x))}
 const L=ws.map(k=>W[k]?W[k].l:0),A=ws.map(k=>W[k]&&W[k].fn?W[k].f/W[k].fn:null),N=ws.map(k=>W[k]?W[k].n:0);
 if(!Object.keys(W).length)return '<h3>Control de carga</h3><p class="mute">Cuando se valoren entrenamientos aparecerá aquí la carga semanal.</p>';
 const prev=L.slice(5,9).filter(x=>x>0),chr=prev.length?prev.reduce((s,x)=>s+x,0)/prev.length:0,ac=L[9],ratio=chr?ac/chr:null;
 let st=['na','Sin base de comparación'];if(ratio!==null){st=ratio>1.5?['far','Carga muy alta']:ratio>1.3?['near','Carga alta, vigilar']:ratio>=.8?['ok','Carga equilibrada']:['near','Carga baja']}
 const w=640,h=240,l=44,r=40,tp=14,b=34,mx=Math.max(...L,5)*1.15,bw=(w-l-r)/10;
 const y=v=>tp+(h-tp-b)*(1-v/mx),y2=v=>tp+(h-tp-b)*(1-(v-1)/4);
 let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Carga semanal de entrenamiento y sensaciones">`;
 for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);s+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v)}</text>`}
 [1,3,5].forEach(v=>s+=`<circle cx="${w-r+10}" cy="${y2(v)}" r="5" fill="${FEEL[v][0]}"/>`);
 ws.forEach((k,i)=>{const x=l+i*bw+bw*.18,bh=(h-b)-y(L[i]);s+=`<rect x="${x}" y="${y(L[i])}" width="${bw*.64}" height="${Math.max(bh,0)}" rx="3" fill="var(--accent)" opacity="${i===9?1:.6}"><title>Semana del ${fd(k)}: carga ${L[i]}, ${N[i]} entrenos</title></rect><text x="${x+bw*.32}" y="${h-b+14}" text-anchor="middle" font-size="10" fill="var(--mute)">${k.slice(8)}/${k.slice(5,7)}</text>`});
 const pts=ws.map((k,i)=>A[i]===null?null:[l+i*bw+bw/2,y2(A[i]),A[i]]);
 s+=`<polyline fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 3" points="${pts.filter(Boolean).map(p=>p[0]+','+p[1]).join(' ')}"/>`;
 pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===9?7:5}" fill="${FEEL[Math.round(p[2])][0]}" stroke="#fff" stroke-width="1.5"><title>Sensaciones medias ${p[2].toFixed(1)}</title></circle>`});
 s+='</svg>';
 return `<h3>Control de carga</h3><div class="row"><span class="pill ${st[0]}">${st[1]}</span>${ratio!==null?`<span class="mute">Esta semana ${ac} frente a ${Math.round(chr)} de media de las 4 anteriores (×${ratio.toFixed(2).replace('.',',')})</span>`:''}</div>
 <div class="lg"><span>Barras: carga semanal (suma de la dureza)</span><span>Puntos: sensaciones medias</span></div>${s}
 <p class="mute">La semana en curso aún está incompleta. Si la carga sube de golpe o las sensaciones bajan varias semanas, conviene hablarlo con el entrenador.</p>`}

function sheetHtml(G){

 let h='<table><colgroup>'+Array.from({length:nc},(_,j)=>`<col style="width:${Math.max(40,(G.widths&&G.widths[j])||100)}px">`).join('')+'</colgroup><tbody>';
 for(let i=0;i<nr;i++){h+='<tr>';for(let j=0;j<nc;j++){if(skip[i+','+j])continue;const sp=span[i+','+j],g=(k)=>(G[k]&&G[k][i]&&G[k][i][j])||'';

 return h+'</tbody></table>'}
